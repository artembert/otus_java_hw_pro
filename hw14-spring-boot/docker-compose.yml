services:
  postgres:
    image: postgres:16-alpine
    container_name: pack-assistant-db
    environment:
      POSTGRES_DB: hw-spring-boot
      POSTGRES_USER: hw-spring-boot
      POSTGRES_PASSWORD: hw-spring-boot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hw-spring-boot"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  